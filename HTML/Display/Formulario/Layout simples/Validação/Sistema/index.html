<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema - CadProd</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>

    <h1>Sistema CadProd - 1.0</h1>


    <div class="container" id="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" required><p></p>

            <label for="senha">Senha</label>
            <input type="password" id="senha" required>

            <button type="submit">Entrar</button>
        </form>
    </div>

 
    <div class="container" id="produto-container" style="display: none;">
        <h2>Cadastro de Produto</h2>
        <form action="" method="POST">
            <div class="rotulos">
                <label for="produto_nome">Nome do Produto</label>
                <input type="text" name="produto_nome" id="produto_nome" required>
            </div>

            <div class="rotulos">
                <label for="descricao">Descrição</label>
                <textarea name="descricao" id="descricao" rows="4" required></textarea>
            </div>

            <div class="rotulos">
                <label for="preco">Preço</label>
                <input type="number" name="preco" id="preco" step="0.01" required>
            </div>

            <div class="rotulos">
                <label for="quantidade">Quantidade</label>
                <input type="number" name="quantidade" id="quantidade" required>
            </div>

            <div class="rotulos">
                <label for="categoria">Categoria</label>
                <select name="categoria" id="categoria" required>
                    <option value="eletronicos">Eletrônicos</option>
                    <option value="roupas">Roupas</option>
                    <option value="alimentos">Alimentos</option>
                    <option value="mobiliario">Mobiliário</option>
                </select>
            </div>

            <div class="bt-submit">
                <input type="submit" value="Cadastrar Produto">
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
