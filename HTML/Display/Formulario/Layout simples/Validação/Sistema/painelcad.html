<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Cadastro de Produtos</title>
    <link rel="stylesheet" href="stylePainelCadProd.css">
</head>

<body>

    <h1>Bem-vindo(a) ao CadProd - 1.0</h1>
    <p id="userWelcome">Carregando...</p>

    <h2>Cadastro de Produtos</h2>

    <form id="productForm">
        <label for="produto">Nome do Produto:</label>
        <input type="text" id="produto" name="produto" placeholder="Informe o nome do produto" required><br><br>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade" placeholder="Informe a quantidade" required><br><br>

        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria">
            <option value="Papelaria">Papelaria</option>
            <option value="Eletrônicos">Eletrônicos</option>
            <option value="Roupas">Roupas</option>
            <option value="Alimentos">Alimentos</option>
            <option value="Outros">Outros</option>
        </select><br><br>

        <label for="preco">Preço (R$):</label>
        <input type="number" id="preco" name="preco" placeholder="Informe o preço do produto" step="0.01" required><br><br>

        <label for="descricao">Descrição:</label><br>
        <textarea id="descricao" name="descricao" rows="4" cols="40" placeholder="Detalhes do produto...">
