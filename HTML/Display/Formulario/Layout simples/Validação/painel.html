<!DOCTYPE html>
<html lang="pt,br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>
</head>
<body>
    <h1>Bem-vindo(a) ao Painel</h1>
    <p id="userWelcome">Carregando...</p>

    <button id="logouBtn">Sair</button>

    <script>
        const username = localStorage.getItem("username");

        if(username){
            documente.getElementById("userWelcome").
            textContent = 'Bem-vindo , ${username}!';
        } else{
          document.getElementById("userWelcome").
          textContent = "Nome de usuario não encontrado.";
        }

        document.getElementById("logoutBtn").addEventListene("click",
        function(){

        localStorage.removeItem("username");

        window.location.href = "index.html";
});



    </script>
    
</body>
</html>
